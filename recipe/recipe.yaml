schema_version: 1

context:
  version: "1.1.1"

package:
  name: pygamma_n
  version: ${{ version }}

source:
  url: https://currents.soest.hawaii.edu/git/uh-currents-group/oceanography-tools/pygamma/-/archive/v${{ version }}/pygamma-v${{ version }}.tar.gz
  sha256: 004781454d6957d208cf06626dff456146835a1e4d11d481ff75695265ca4a5d

build:
  number: 0
  skip:
    - win
  script:
    - if: win
      then:
        - set SETUPTOOLS_SCM_PRETEND_VERSION=${{ version }}
    - if: unix
      then:
        - export SETUPTOOLS_SCM_PRETEND_VERSION=${{ version }}
        - meson ${MESON_ARGS} builddir/  # fix cross-compilation
    - python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
        - meson-python >=0.15
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('fortran') }}
  host:
    - python
    - pip
    - numpy
    - meson-python >=0.15
    - netcdf-fortran
    - netcdf-fortran * nompi_*
    - setuptools_scm
  run:
    - python
    - netcdf-fortran
    - netcdf-fortran * nompi_*
    - numpy

tests:
  - python:
      imports:
        - pygamma_n
      pip_check: true
  - requirements:
      run:
        - python
        - pytest
    files:
      source:
        - pygamma_n/tests/
    script:
        - pytest pygamma_n/tests/
        - python -c "import pygamma_n; print(f'{pygamma_n.__version__=}')"

about:
  homepage: https://currents.soest.hawaii.edu/git/uh-currents-group/oceanography-tools/pygamma
  license: MIT AND LicenseRef-CSIRO
  license_file: pygamma_n/src/ConditionsOfUse
  summary: Python interface for the original Fortran neutral density

extra:
  recipe-maintainers:
    - ocefpaf
    - efiring
